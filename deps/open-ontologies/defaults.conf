# Defaults for the local Open Ontologies server (shell syntax, sourced by server.sh).
# Override per machine in local.conf next to this file (gitignored; see
# local.conf.example), or per call: `make oo-server OO_SRC=../open-ontologies`.
# Precedence: environment / make command line > local.conf > this file.

# Where the engine is cloned from, and which ref a fresh clone checks out.
# An existing clone is used as it is: it is never pulled or switched.
OO_REPO=https://github.com/fabio-rovai/open-ontologies.git
OO_REF=v2.1.0

# Local clone of the engine. A relative path is taken from the root of the main
# checkout, so git worktrees share one clone. `oo/` is gitignored.
OO_SRC=oo

# Server address; keep it equal to store.url in ontologizer.yaml. The host port
# published on 127.0.0.1 is taken from it.
OO_URL=http://127.0.0.1:8080
